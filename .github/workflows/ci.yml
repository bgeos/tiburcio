# P2-10 · Runs every check from CLAUDE.md "End of every task" on each push to main and
# on pull requests. Uses only a throwaway local Supabase inside the runner: no hosted
# project, no secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Production build
        run: npm run build
        env:
          # Placeholders: building never contacts Supabase (sessions are read at request time).
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - name: No secrets in the browser bundle
        run: |
          if grep -rlE 'sb_secret_|service_role|SUPABASE_SECRET_KEY' .next/static; then
            echo "::error::A secret-looking string is in the client bundle (files listed above)."
            exit 1
          fi

  database-and-browser:
    name: Database (RLS) and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start local Supabase (Postgres, Auth, API, Mailpit)
        run: npx supabase start -x realtime,storage-api,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor
      - name: Write .env.local from the local stack
        run: npm run db:env
      - name: Database security tests (pgTAP)
        run: npm run test:db
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Browser and accessibility tests (Playwright)
        run: npm run test:e2e
      - name: Keep the Playwright report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
